<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SSPA 400 LMS{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; }
    nav {
      background: #1e3a5f; color: #fff; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    nav .brand { font-weight: 800; font-size: 18px; letter-spacing: .5px; }
    nav .links { display: flex; gap: 20px; align-items: center; }
    nav a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 14px; }
    nav a:hover { color: #fff; }
    nav .btn-logout {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 5px 14px; border-radius: 8px; font-size: 13px;
      cursor: pointer; text-decoration: none;
    }
    nav .btn-logout:hover { background: rgba(255,255,255,.25); }
    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .card {
      background: #fff; border-radius: 16px; padding: 28px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07); margin-bottom: 24px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 16px; color: #1e3a5f; }
    h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; color: #334155; }
    .btn {
      display: inline-block; padding: 10px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
      border: none; transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn-primary { background: #1e3a5f; color: #fff; }
    .btn-gold { background: #d97706; color: #fff; }
    .btn-outline { background: transparent; border: 2px solid #1e3a5f; color: #1e3a5f; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
    input[type=text], input[type=password], input[type=email] {
      width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1;
      border-radius: 10px; font-size: 14px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #1e3a5f; }
    .error { color: #dc2626; font-size: 13px; margin-top: 4px; }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
    .alert-error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<nav>
  <span class="brand">🎖 SSPA 400 LMS</span>
  {% if user.is_authenticated %}
  <div class="links">
    <a href="{% url 'dashboard' %}">Хичээл</a>
    <a href="{% url 'profile' %}">Профайл</a>
    <a href="{% url 'logout' %}" class="btn-logout">Гарах</a>
  </div>
  {% else %}
  <div class="links">
    <a href="{% url 'login' %}">Нэвтрэх</a>
    <a href="{% url 'register' %}">Бүртгүүлэх</a>
  </div>
  {% endif %}
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
